<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>Reset Password - Medical Store Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fontawesome.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚕️</text></svg>" type="image/svg+xml">
</head>
<body class="auth-page">
    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode (Alt+T)" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    
    <div class="container">
        <div class="auth-card enhanced">
            <!-- App Header -->
            <div class="header">
                <div class="logo-container">
                    <div class="icon-wrapper">
                        <div class="icon animated">🔐</div>
                    </div>
                    <div class="app-title">
                        <h1>Reset Password</h1>
                        <p class="version">Secure Recovery</p>
                    </div>
                </div>
                <p class="subtitle">Enter your username to reset password</p>
            </div>
            
            <!-- Step 1: Username Verification -->
            <div id="step1" class="reset-step">
                <form id="usernameForm">
                    <div class="form-group">
                        <label for="store_code">
                            <i class="fas fa-store"></i> Store Code
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="store_code" 
                                name="store_code" 
                                placeholder="Enter Store Code (e.g. STORE123)" 
                                required 
                                autocomplete="off"
                                aria-label="Store Code">
                            <span class="input-icon"><i class="fas fa-check-circle"></i></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                placeholder="Enter your username" 
                                required 
                                autocomplete="username"
                                aria-label="Username">
                            <span class="input-icon"><i class="fas fa-check-circle"></i></span>
                        </div>
                        <span class="error-message" id="usernameError"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg" id="checkBtn">
                        <span class="btn-text">
                            <i class="fas fa-arrow-right"></i> Continue
                        </span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                    
                    <div class="alert" id="alert1" style="display: none;" role="alert"></div>
                </form>
            </div>
            
            <!-- Step 2: New Password -->
            <div id="step2" class="reset-step" style="display: none;">
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="newPassword">
                            <i class="fas fa-lock"></i> New Password
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="newPassword" 
                                name="newPassword" 
                                placeholder="Enter new password (min 6 chars)" 
                                required 
                                autocomplete="new-password"
                                aria-label="New password">
                            <button 
                                type="button" 
                                class="password-toggle" 
                                onclick="togglePassword('newPassword')" 
                                aria-label="Toggle password visibility">
                                <i class="fas fa-eye" id="newPasswordIcon"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm new password" 
                                required 
                                autocomplete="new-password"
                                aria-label="Confirm password">
                            <button 
                                type="button" 
                                class="password-toggle" 
                                onclick="togglePassword('confirmPassword')" 
                                aria-label="Toggle password visibility">
                                <i class="fas fa-eye" id="confirmPasswordIcon"></i>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg" id="resetBtn">
                        <span class="btn-text">
                            <i class="fas fa-key"></i> Reset Password
                        </span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                    
                    <div class="alert" id="alert2" style="display: none;" role="alert"></div>
                </form>
            </div>
            
            <!-- Footer Links -->
            <div class="footer">
                <p>Remember your password? <a href="login.html">Back to Login</a></p>
            </div>
            
            <!-- Security Badge -->
            <div class="security-badges">
                <span class="badge-item">
                    <i class="fas fa-shield-alt"></i> Secure Reset
                </span>
            </div>
        </div>
    </div>
    
    <script src="theme.js"></script>
    <script>
        const API_BASE_URL = '/api';
        let verifiedUsername = '';
        let verifiedStoreCode = '';
        
        // Initialize theme
        initTheme();
        
        // Show alert
        function showAlert(message, type, alertId) {
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        // Step 1: Check username
        document.getElementById('usernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const store_code = document.getElementById('store_code').value.trim();
            
            if (!store_code) {
                showAlert('Please enter Store Code', 'error', 'alert1');
                return;
            }

            if (!username || username.length < 3) {
                showAlert('Please enter a valid username (min 3 characters)', 'error', 'alert1');
                return;
            }
            
            const submitBtn = document.getElementById('checkBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoader = submitBtn.querySelector('.btn-loader');
            
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            
            try {
                const response = await fetch(`${API_BASE_URL}/check-username`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, store_code })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    verifiedUsername = username;
                    verifiedStoreCode = store_code;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    showAlert('Account found! Please set a new password.', 'success', 'alert2');
                } else {
                    showAlert(data.message || 'Username not found', 'error', 'alert1');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'error', 'alert1');
            } finally {
                submitBtn.disabled = false;
                btnText.style.display = 'flex';
                btnLoader.style.display = 'none';
            }
        });
        
        // Step 2: Reset password
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Clear errors
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
            
            // Validate
            if (newPassword.length < 6) {
                document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                return;
            }
            
            const submitBtn = document.getElementById('resetBtn');
            const btnText = submitBtn.querySelector('.btn-text');
            const btnLoader = submitBtn.querySelector('.btn-loader');
            
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            
            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_code: verifiedStoreCode,
                        username: verifiedUsername,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Password reset successfully! Redirecting to login...', 'success', 'alert2');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Password reset failed', 'error', 'alert2');
                    submitBtn.disabled = false;
                    btnText.style.display = 'flex';
                    btnLoader.style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'error', 'alert2');
                submitBtn.disabled = false;
                btnText.style.display = 'flex';
                btnLoader.style.display = 'none';
            }
        });
        
        // Password strength indicator
        document.getElementById('newPassword').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const strengthPercent = (strength / 5) * 100;
            strengthBar.style.width = strengthPercent + '%';
            
            if (strength <= 2) {
                strengthBar.style.backgroundColor = '#e63757';
            } else if (strength <= 3) {
                strengthBar.style.backgroundColor = '#f6c343';
            } else {
                strengthBar.style.backgroundColor = '#00d97e';
            }
        });
        
        // Auto-focus username
        if (window.innerWidth > 768) {
            window.addEventListener('load', () => {
                document.getElementById('username').focus();
            });
        }
    </script>
</body>
</html>
